[package]
name = "gdpw"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
futures-util = { version = "=0.3.34", features = ["sink"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }

[profile.release]
lto = "thin"
strip = true
