name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options: [gd, cli]
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

concurrency: release-${{ github.repository }}-${{ inputs.target }}

jobs:
  gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Determine release version
        id: release
        env:
          TARGET: ${{ inputs.target }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run releases from main.' >&2; exit 1; }
          case "$TARGET" in gd) prefix=gd-v ;; cli) prefix=cli-v ;; *) exit 1 ;; esac
          git fetch --tags --force
          latest="$(git tag --list "${prefix}[0-9]*" | sed -E "s/^${prefix}//" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version=0.0.1
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) exit 1 ;;
            esac
            version="$major.$minor.$patch"
          fi
          tag="$prefix$version"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo "Tag exists: $tag" >&2; exit 1; }
          if [ "$TARGET" = gd ]; then
            plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' gd/addon/plugin.cfg)"
            [ "$plugin_version" = "$version" ] || { echo "plugin.cfg=$plugin_version, next release=$version" >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Common exact-commit gate
        uses: ./.github/actions/test

      - name: Build CLI release artifacts
        if: inputs.target == 'cli'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          build() {
            goos="$1"; goarch="$2"; os_label="$3"; arch_label="$4"; archive_ext="$5"
            exe=""; [ "$goos" != windows ] || exe=.exe
            name="gdpw_${os_label}_${arch_label}"
            mkdir -p "dist/$name"
            (cd cli && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "$GITHUB_WORKSPACE/dist/$name/gdpw$exe" ./cmd/gdpw/)
            cp README.md "dist/$name/README.md"
            if [ "$archive_ext" = zip ]; then
              (cd "dist/$name" && zip -X -q "../$name.zip" "gdpw$exe" README.md)
            else
              tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
                -C "dist/$name" -czf "dist/$name.tar.gz" "gdpw$exe" README.md
            fi
          }
          build linux amd64 Linux x86_64 tar.gz
          build linux arm64 Linux arm64 tar.gz
          build darwin amd64 Darwin x86_64 tar.gz
          build darwin arm64 Darwin arm64 tar.gz
          build windows amd64 Windows x86_64 zip
          build windows arm64 Windows arm64 zip
          (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt)

      - name: Select immutable release payload
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          mkdir release-assets
          if [ "$TARGET" = gd ]; then
            cp dist/@aviorstudio_gd-playwright.zip dist/gd-package-digests.txt release-assets/
          else
            cp dist/*.tar.gz dist/*.zip dist/checksums.txt release-assets/
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ github.sha }}-${{ inputs.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-assets-${{ github.sha }}-${{ inputs.target }}
          path: dist

      - name: Verify transported GD bytes
        if: inputs.target == 'gd'
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^GD_PACKAGE_SHA256=//p' dist/gd-package-digests.txt)"
          printf '%s  %s\n' "$expected" dist/@aviorstudio_gd-playwright.zip | sha256sum --check

      - name: Create GitHub Release from tested bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG from tested commit $GITHUB_SHA"

      - name: Install GDAM
        if: inputs.target == 'gd'
        uses: aviorstudio/gdam-actions/install@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          version: v0.0.8

      - name: Publish exact GitHub asset to GDAM
        if: inputs.target == 'gd'
        uses: aviorstudio/gdam-actions/publish@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          tag: ${{ needs.gate.outputs.tag }}
          addon: '@aviorstudio/gd-playwright'
          asset: '@aviorstudio_gd-playwright.zip'
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
