name: Release
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options:
        - gd
        - cli
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
concurrency: release-${{ github.repository }}-${{ inputs.target }}
jobs:
  gate:
    name: Verify release
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up locked Komizo
      uses: nicodes/komizo/setup@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Determine release version
      id: release
      env:
        TARGET: ${{ inputs.target }}
        BUMP: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run releases from main.' >&2; exit 1; }
        case "$TARGET" in gd) prefix=gd-v ;; cli) prefix=cli-v ;; *) exit 1 ;; esac
        git fetch --tags --force
        latest="$(git tag --list "${prefix}[0-9]*" | sed -E "s/^${prefix}//" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          version=0.0.1
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) exit 1 ;;
          esac
          version="$major.$minor.$patch"
        fi
        tag="$prefix$version"
        git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo "Tag exists: $tag" >&2; exit 1; }
        if [ "$TARGET" = gd ]; then
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' gd/addon/plugin.cfg)"
          [ "$plugin_version" = "$version" ] || { echo "plugin.cfg=$plugin_version, next release=$version" >&2; exit 1; }
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Check project
      uses: nicodes/komizo/run@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      with:
        target: check
    - name: Build CLI release artifacts
      if: inputs.target == 'cli'
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        komizo exec --tools go -- bash -euo pipefail <<'KOMIZO_COMMAND'
        set -euo pipefail
        rm -rf dist
        mkdir -p dist
        build() {
          goos="$1"; goarch="$2"; os_label="$3"; arch_label="$4"; archive_ext="$5"
          exe=""; [ "$goos" != windows ] || exe=.exe
          name="gdpw_${os_label}_${arch_label}"
          mkdir -p "dist/$name"
          (cd cli && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "$GITHUB_WORKSPACE/dist/$name/gdpw$exe" ./cmd/gdpw/)
          cp README.md "dist/$name/README.md"
          if [ "$archive_ext" = zip ]; then
            (cd "dist/$name" && zip -X -q "../$name.zip" "gdpw$exe" README.md)
          else
            tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
              -C "dist/$name" -czf "dist/$name.tar.gz" "gdpw$exe" README.md
          fi
        }
        build linux amd64 Linux x86_64 tar.gz
        build linux arm64 Linux arm64 tar.gz
        build darwin amd64 Darwin x86_64 tar.gz
        build darwin arm64 Darwin arm64 tar.gz
        build windows amd64 Windows x86_64 zip
        build windows arm64 Windows arm64 zip
        (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt)
        KOMIZO_COMMAND
    - name: Select immutable release payload
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        mkdir release-assets
        if [ "$TARGET" = gd ]; then
          cp dist/@aviorstudio_gd-playwright.zip dist/gd-package-digests.txt release-assets/
        else
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt release-assets/
        fi
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-assets-${{ github.sha }}-${{ inputs.target }}
        path: release-assets/
        if-no-files-found: error
        retention-days: 7
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish:
    name: Publish release
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-assets-${{ github.sha }}-${{ inputs.target }}
        path: dist
    - name: Verify transported GD bytes
      if: inputs.target == 'gd'
      run: |
        set -euo pipefail
        expected="$(sed -n 's/^GD_PACKAGE_SHA256=//p' dist/gd-package-digests.txt)"
        printf '%s  %s\n' "$expected" dist/@aviorstudio_gd-playwright.zip | sha256sum --check
    - name: Create GitHub Release from tested bytes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.gate.outputs.tag }}
      run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG from tested
        commit $GITHUB_SHA"
    - name: Publish addon
      if: inputs.target == 'gd'
      uses: aviorstudio/gdam-actions/publish@6677226d9353df1d410f3e7f5075e13b3b7d5308
      with:
        tag: ${{ needs.gate.outputs.tag }}
        addon: '@aviorstudio/gd-playwright'
        asset: '@aviorstudio_gd-playwright.zip'
        api-key: ${{ secrets.GDAM_API_KEY }}
