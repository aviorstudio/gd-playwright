name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
concurrency: release-${{ github.repository }}
jobs:
  gate:
    name: Verify release
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      artifact-id: ${{ steps.accepted.outputs.artifact-id }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@a1c0321f3b4917a7e99eca42e241e46670f6e1e1
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Determine release version
      id: release
      env:
        TARGET: gd
        BUMP: ${{ inputs.bump }}
      run: |-
        set -euo pipefail
        [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run releases from main.' >&2; exit 1; }
        case "$TARGET" in gd) prefix=gd-v ;; *) exit 1 ;; esac
        case "$BUMP" in patch|minor|major) ;; *) exit 1 ;; esac
        git fetch --tags --force
        latest="$(git tag --list "${prefix}[0-9]*" | sed -E "s/^${prefix}//" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          version=0.0.1
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) exit 1 ;;
          esac
          version="$major.$minor.$patch"
        fi
        tag="$prefix$version"
        git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo "Tag exists: $tag" >&2; exit 1; }
        if [ "$TARGET" = gd ]; then
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg)"
          [ "$plugin_version" = "$version" ] || { echo "plugin.cfg=$plugin_version, next release=$version" >&2; exit 1; }
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Check project
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    - name: Select immutable release payload
      env:
        TARGET: gd
      run: |
        set -euo pipefail
        mkdir release-assets
        cp dist/@aviorstudio_gd-playwright.zip dist/gd-package-digests.txt release-assets/
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-assets-${{ github.sha }}-gd
        path: release-assets/
        if-no-files-found: error
        retention-days: 7
      id: accepted
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish:
    name: Publish release
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-assets-${{ github.sha }}-gd
        path: dist
    - name: Verify transported GD bytes
      run: |-
        set -euo pipefail
        expected="$(sed -n 's/^GD_PACKAGE_SHA256=//p' dist/gd-package-digests.txt)"
        printf '%s  %s\n' "$expected" dist/@aviorstudio_gd-playwright.zip | sha256sum --check
    - name: Create GitHub Release from tested bytes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.gate.outputs.tag }}
      run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes
        "Release $TAG from tested commit $GITHUB_SHA"
    - name: Publish addon
      uses: aviorstudio/gdam-actions/publish@3a46007e296e60e15a4ad47727ad33046e52e6ea
      with:
        tag: ${{ needs.gate.outputs.tag }}
        addon: '@aviorstudio/gd-playwright'
        asset: '@aviorstudio_gd-playwright.zip'
        api-key: ${{ secrets.GDAM_API_KEY }}
