name: Release GD

on:
  push:
    tags:
      - 'gd-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        run: |
          set -euo pipefail
          test -f gd/addon/plugin.cfg
          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          tag_name="${GITHUB_REF_NAME}"
          addon_dir="@${repo_owner}_${repo_name}"
          package_root="dist/addons/${addon_dir}"
          mkdir -p "$package_root"
          cp gd/addon/plugin.cfg gd/addon/plugin.gd "$package_root/"
          cp gd/addon/*.uid "$package_root/" 2>/dev/null || true
          if [ -f gd/addon/autoload.gd ]; then cp gd/addon/autoload.gd "$package_root/"; fi
          if [ -d gd/addon/src ]; then cp -R gd/addon/src "$package_root/"; fi
          (cd dist && zip -r "${repo_name}-${tag_name}.zip" addons)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
