name: CI

# Every pull request and every merge to main: test, on one runner.
#
# The common action runs every shipped suite and verifies the exact assembled GD
# release ZIP through clean editor lifecycle and ordinary/diagnostic web exports.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable. A tag is a moving reference:
      # whoever can move it can run code in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: go bun node python actionlint shellcheck http:cicd-engineering

      - name: Test
        uses: ./.github/actions/test
