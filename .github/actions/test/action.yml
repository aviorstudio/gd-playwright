name: Test
description: >
  Is this commit good. Nothing is packaged for release here and nothing is
  published; a failure means the addon is wrong, not that the pipeline is.

  A composite action rather than a reusable workflow so it runs in the caller's
  job, under the caller's name -- CI / Test, Release / Test -- rather than as a
  nested "caller / callee" check.

  Correction (aviorstudio/fieldsofrevik#148): the earlier text said this one
  definition guarded release, but the GD release bypassed it and this action
  omitted the shipped JavaScript suite. CI and Release now call this action,
  which runs Go, Godot, JavaScript, runner controls, and the exact GD package
  lifecycle gate.

  A per-repo copy, not a shared action. `uses: ./` is repo-local, so the
  fourteen copies of this file are copies -- the accepted cost of no repo's CI
  breaking because another repo changed.

runs:
  using: composite
  steps:
    - name: Validate shipped suite and package inputs
      shell: bash
      run: |
        set -euo pipefail
        test -s cli/go.mod
        test -n "$(find cli -name '*_test.go' -type f -print -quit)"
        test -s js/index.test.js
        test -s gd/package-manifest.txt
        test -n "$(find gd/tests -name '*_test.gd' -type f -print -quit)"

    - name: Package gate controls
      shell: bash
      run: PYTHONPATH=tools python3 -m unittest -v tools/package_gd_test.py

    - name: Godot runner controls
      shell: bash
      run: bash gd/tests/test_runner_test.sh

    # No `if: hashFiles(...)` guard. This step used to skip itself when
    # cli/go.mod was absent, which is indistinguishable from the module being
    # moved -- a skipped test is a green tick. This addon ships a Go CLI, so the
    # step runs unconditionally.
    - name: Go tests
      shell: bash
      working-directory: cli
      run: go test ./...

    - name: JavaScript tests
      shell: bash
      working-directory: js
      run: bun test

    - name: Install verified Godot test binary
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gd-playwright-godot.zip"
        directory="$RUNNER_TEMP/gd-playwright-godot"
        curl --fail --location --retry 3 --max-time 180 \
          https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
          --output "$archive"
        printf '%s  %s\n' '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65' "$archive" | sha512sum --check
        mkdir -p "$directory"
        unzip -o "$archive" Godot_v4.7.2-stable_linux.x86_64 -d "$directory"
        chmod +x "$directory/Godot_v4.7.2-stable_linux.x86_64"
        echo "GODOT_BIN=$directory/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

    - name: Godot regression tests
      shell: bash
      run: bash gd/tests/test.sh

    - name: Build and inspect exact GD release ZIP
      shell: bash
      run: |
        set -euo pipefail
        rm -rf dist
        python3 tools/package_gd.py
        python3 tools/verify_gd_package.py dist/@aviorstudio_gd-playwright.zip \
          | tee dist/gd-package-digests.txt

    - name: Install exact ZIP and verify editor lifecycle
      shell: bash
      run: bash gd/tests/package_lifecycle_test.sh dist/@aviorstudio_gd-playwright.zip
