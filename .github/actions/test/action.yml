name: Test
description: Run every shipped suite, exact GD ZIP lifecycle and ordinary/diagnostic browser release checks.
runs:
  using: composite
  steps:
    - name: Cache verified Godot archives
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .artifacts/godot/archives
        key: gd-playwright-${{ runner.os }}-${{ runner.arch }}-godot-builds-4.7.2-sha512-9aa00f7a60520094-ca4d71c4d7b81dfc
    - name: Install pinned dependencies and verified engine/templates
      shell: bash
      run: make install
    - name: Common exact-commit gate
      shell: bash
      run: make check
    - name: Upload web release acceptance evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: gd-web-evidence-${{ github.run_id }}-${{ github.job }}
        path: dist/web-export-evidence/
        if-no-files-found: error
        retention-days: 30
